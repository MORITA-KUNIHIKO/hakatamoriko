<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>わたしのタスク管理</title>
  <link rel="stylesheet" href="style.css?v=2">
</head>
<body>
  <main class="container">
    <header class="header">
      <h1>わたしのタスク管理</h1>
      <div id="user-bar" class="user-bar" hidden>
        <span id="user-email"></span>
        <button type="button" id="logout-button" class="sub-button">ログアウト</button>
      </div>
    </header>

    <p id="message" class="message" hidden></p>

    <!-- ログイン画面 -->
    <section id="auth-section" hidden>
      <form id="auth-form" class="auth-form">
        <input type="email" id="auth-email" placeholder="メールアドレス" autocomplete="email" required>
        <input type="password" id="auth-password" placeholder="パスワード（6文字以上）" autocomplete="current-password" minlength="6" required>
        <div class="auth-buttons">
          <button type="submit" class="main-button">ログイン</button>
          <button type="button" id="signup-button" class="sub-button">新規登録</button>
        </div>
      </form>
    </section>

    <!-- タスク画面 -->
    <section id="app-section" hidden>
      <form id="task-form" class="task-form">
        <input
          type="text"
          id="task-input"
          placeholder="タスクを入力"
          autocomplete="off"
          required
        >
        <input type="date" id="task-date" class="date-input" aria-label="日付（なくてもOK）">
        <button type="submit">追加</button>
      </form>

      <ul id="task-list" class="task-list"></ul>
    </section>
  </main>

  <script type="module" src="script.js?v=6"></script>
</body>
</html>
